<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>/api/chat test</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; max-width: 480px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
  textarea { width: 100%; box-sizing: border-box; font-size: 16px; padding: 0.6rem; margin-bottom: 0.6rem; }
  button { font-size: 16px; padding: 0.6rem 1.2rem; }
  pre { white-space: pre-wrap; word-break: break-word; background: #f4f4f4; padding: 0.8rem; border-radius: 6px; margin-top: 1rem; }
  .error { color: #b00020; }
</style>
</head>
<body>
<h1>/api/chat test</h1>
<textarea id="msg" rows="3">What services do you offer?</textarea>
<button id="send">Send</button>
<pre id="out">Response will appear here.</pre>
<script>
  document.getElementById('send').addEventListener('click', async () => {
    const out = document.getElementById('out');
    const message = document.getElementById('msg').value;
    out.textContent = 'Sending…';
    out.className = '';
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: [{ role: 'user', content: message }] })
      });
      const data = await res.json();
      out.textContent = `HTTP ${res.status}\n\n` + JSON.stringify(data, null, 2);
      if (!res.ok) out.className = 'error';
    } catch (err) {
      out.textContent = 'Request failed: ' + err.message;
      out.className = 'error';
    }
  });
</script>
</body>
</html>
